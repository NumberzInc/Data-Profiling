database:
  schema: public
  include_tables: []

sampling:
  mode: sampled
  sample_rows: 50000

thresholds:
  wide_table_columns: 75
  max_normalized_collision_rate: 0.02
  min_join_match_rate: 0.95
  min_affix_frequency: 0.10

history:
  path: state/profile_history.jsonl

freshness:
  trusted_timestamp_columns: {}
  expected_update_intervals_hours: {}

ydata:
  enabled: true
  include_raw: false
  explorative: true
